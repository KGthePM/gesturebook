<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GestureBook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* v3: apply saved city theme before first paint (no flash). classic = no attr. */
  try {
    var t = localStorage.getItem("gesturebook:theme");
    if (t === "seattle" || t === "boston") {
      document.documentElement.setAttribute("data-theme", t);
    }
  } catch (_) { /* storage unavailable — stay classic */ }
</script>
<link rel="stylesheet" href="style.css">
<!-- PDF.js 3.11.174 (pinned, cdnjs) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

<div id="vignette" aria-hidden="true"></div>

<header id="topbar" aria-hidden="true">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 6c-1.5-1.8-4.2-2.5-7-2v14c2.8-.5 5.5.2 7 2 1.5-1.8 4.2-2.5 7-2V4c-2.8-.5-5.5.2-7 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M12 6v14" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <h1>GestureBook</h1>
  </div>
  <label class="btn quiet" for="pdf-file">Open PDF</label>
  <input type="file" id="pdf-file" accept="application/pdf" hidden>
  <button class="btn quiet" id="cam-toggle">Start camera</button>
  <button class="btn quiet" id="mode-toggle" aria-pressed="false" title="Cycle Book / Read / Half-page view (or press S)">Read view</button>
  <button class="btn quiet hidden" id="toc-toggle" aria-haspopup="true" aria-expanded="false" title="Table of contents">Contents</button>
  <div class="theme-picker" id="theme-picker" role="group" aria-label="Reading-room theme">
    <button class="theme-opt" data-set-theme="classic" aria-pressed="true" title="Classic charcoal">Classic</button>
    <button class="theme-opt" data-set-theme="seattle" aria-pressed="false" title="Seattle rain">Seattle</button>
    <button class="theme-opt" data-set-theme="boston" aria-pressed="false" title="Boston lamplight">Boston</button>
  </div>
  <button type="button" id="page-label" title="Tap to jump to a page">No PDF loaded</button>
  <input type="number" id="page-jump-input" class="hidden" min="1" inputmode="numeric" aria-label="Jump to page">
</header>

<div id="toc-panel" class="hidden" role="menu" aria-label="Table of contents"></div>

<main id="stage">

  <!-- v3 Reading Room: the whole home section is the dropzone -->
  <div id="dropzone">
    <div class="glow g1" aria-hidden="true"></div>
    <div class="glow g2" aria-hidden="true"></div>
    <div class="glow g3" aria-hidden="true"></div>
    <div class="lamp" aria-hidden="true"></div>
    <div class="motes m1" aria-hidden="true"></div>
    <div class="motes m2" aria-hidden="true"></div>
    <div class="rain" aria-hidden="true"></div>

    <div class="book-closed">
      <div class="bc-page"></div>
      <div class="bc-cover"><span class="bc-mark">GestureBook</span></div>
    </div>

    <p class="dz-hint">Drop a PDF anywhere &middot; or click the book</p>
  </div>

  <div id="book" class="hidden">
    <div class="page left"><canvas id="canvas-left"></canvas></div>
    <div class="page right"><canvas id="canvas-right"></canvas></div>
    <div id="flip-layer"></div>
  </div>
</main>

<div id="drop-overlay" class="hidden">
  <div class="drop-frame">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 16V6m0 0l-3.5 3.5M12 6l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>Release to open</span>
  </div>
</div>

<div id="loading" class="hidden">
  <div class="load-card">
    <div class="spinner" aria-hidden="true"></div>
    <div class="load-title" id="load-title">Opening book…</div>
    <div class="load-bar"><div id="load-fill"></div></div>
    <div class="load-pct" id="load-pct"></div>
  </div>
</div>

<div id="status-pill" aria-live="polite">Open a PDF to begin</div>

<div id="hint">Pinch &amp; drag left · next page&nbsp;&nbsp;&nbsp;Pinch &amp; drag right · previous&nbsp;&nbsp;&nbsp;Quick swipe works too&nbsp;&nbsp;&nbsp;Half-page: pinch to scroll&nbsp;&nbsp;&nbsp;Open palm · controls&nbsp;&nbsp;&nbsp;S · cycle view&nbsp;&nbsp;&nbsp;← → keys work too</div>

<!-- video stays in DOM (gesture engine needs the stream) but is never shown -->
<div id="cam-overlay" class="hidden" aria-hidden="true">
  <video id="cam-video" autoplay playsinline muted></video>
</div>

<div id="hand-pointer" aria-hidden="true"><div class="hp-ring"></div></div>

<!-- v3: floating mode toggle — the dwell target when reading with gestures -->
<button id="mode-fab" class="hidden" data-mode="book" aria-pressed="false" title="Pinch-hold ~2s to cycle view (or press S)">
  <svg class="mf-icon-book" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M12 6c-1.5-1.8-4.2-2.5-7-2v14c2.8-.5 5.5.2 7 2 1.5-1.8 4.2-2.5 7-2V4c-2.8-.5-5.5.2-7 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M12 6v14" stroke="currentColor" stroke-width="1.5"/>
  </svg>
  <svg class="mf-icon-page" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="6" y="4" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
    <path d="M9.5 9h5M9.5 12.5h5M9.5 16h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <svg class="mf-icon-half" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M7 4h10a1 1 0 0 1 1 1v9H6V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M6 14v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M9.5 9h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 18l2 2 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg class="mf-progress" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
    <circle class="mf-track" cx="22" cy="22" r="20"/>
    <circle class="mf-fill" cx="22" cy="22" r="20"/>
  </svg>
</button>

<script type="module" src="js/app.js"></script>
</body>
</html>
